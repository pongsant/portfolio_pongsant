<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Photo</title>
    <meta name="description" content="Selected digital and film photography.">
    <link rel="stylesheet" href="../styles.css?v=20260529o">
    <script src="../script.js?v=20260529o" defer></script>
    <style>
      .page-photo-index {
        background: #ffffff;
        color: #050505;
      }

      .page-photo-index .site-header {
        background: rgba(255, 255, 255, 0.92);
      }

      .photo-index {
        background: #ffffff;
      }

      .photo-index-section {
        min-height: 100svh;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        gap: clamp(0.65rem, 1.3vw, 1rem);
        padding:
          calc(5.6rem + var(--safe-top))
          clamp(0.65rem, 1.2vw, 1rem)
          clamp(0.65rem, 1.2vw, 1rem);
        border-bottom: 1px solid rgba(0, 0, 0, 0.18);
        background: #ffffff;
      }

      .photo-index-section__topline {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        font-size: clamp(0.62rem, 0.75vw, 0.78rem);
        font-weight: 800;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .photo-index-section__back,
      .photo-index-section__more {
        color: inherit;
        text-decoration: underline;
        text-decoration-thickness: 0.08em;
        text-underline-offset: 0.16em;
      }

      .photo-index-section__back {
        width: 2.1rem;
        height: 2.1rem;
        display: inline-grid;
        place-items: center;
        border: 1px solid rgba(0, 0, 0, 0.2);
        border-radius: 999px;
        text-decoration: none;
        font-size: 1.28rem;
        line-height: 1;
      }

      .photo-index-section__layout {
        min-height: 0;
        display: grid;
        grid-template-columns: minmax(0, 1.12fr) minmax(280px, 0.88fr);
        gap: clamp(1rem, 2vw, 1.8rem);
        align-items: end;
      }

      .photo-index-section__copy {
        display: grid;
        align-content: end;
        gap: clamp(0.55rem, 1vw, 0.85rem);
        min-height: 0;
      }

      .photo-index-section__count {
        margin: 0;
        font-size: clamp(0.72rem, 0.9vw, 0.9rem);
        font-weight: 500;
        letter-spacing: 0.05em;
      }

      .photo-index-section__title {
        margin: 0;
        max-width: 8ch;
        font-size: clamp(4.2rem, 9.3vw, 10.6rem);
        font-weight: 900;
        line-height: 0.82;
        letter-spacing: -0.07em;
        text-transform: uppercase;
      }

      .photo-index-section__copy .photo-index-section__more {
        width: fit-content;
        margin-top: 0.12rem;
        font-size: clamp(0.72rem, 0.86vw, 0.9rem);
        font-weight: 800;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .photo-index-section__feature {
        min-width: 0;
        margin: 0;
        display: grid;
        gap: 0.42rem;
      }

      .photo-index-section__feature-image {
        width: 100%;
        height: min(68svh, 720px);
        display: block;
        object-fit: cover;
        object-position: center center;
        border: 1px solid rgba(0, 0, 0, 0.16);
        background: #f2f2f2;
      }

      .photo-index-section__caption {
        display: block;
        font-size: clamp(0.62rem, 0.75vw, 0.78rem);
        font-weight: 800;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .photo-index-strip {
        display: grid;
        grid-template-columns: repeat(10, minmax(0, 1fr));
        gap: clamp(0.28rem, 0.62vw, 0.56rem);
      }

      .photo-index-strip__item {
        appearance: none;
        border: 0;
        padding: 0;
        background: transparent;
        min-width: 0;
        display: grid;
        gap: 0.18rem;
        color: inherit;
        cursor: pointer;
        text-align: left;
      }

      .photo-index-strip__number {
        font-size: clamp(0.56rem, 0.68vw, 0.7rem);
        font-weight: 800;
        line-height: 1;
      }

      .photo-index-strip__image {
        width: 100%;
        aspect-ratio: 1 / 1.22;
        display: block;
        object-fit: cover;
        object-position: center center;
        border: 1px solid rgba(0, 0, 0, 0.12);
        background: #f2f2f2;
        transition: transform 180ms ease, border-color 180ms ease;
      }

      .photo-index-strip__item:hover .photo-index-strip__image,
      .photo-index-strip__item:focus-visible .photo-index-strip__image,
      .photo-index-strip__item.is-active .photo-index-strip__image {
        transform: translateY(-2px);
        border-color: rgba(0, 0, 0, 0.58);
      }

      .photo-index-strip__item.is-active .photo-index-strip__number {
        text-decoration: underline;
        text-decoration-thickness: 0.08em;
        text-underline-offset: 0.18em;
      }

      @media (max-width: 900px) {
        .photo-index-section {
          min-height: auto;
        }

        .photo-index-section__layout {
          grid-template-columns: 1fr;
          align-items: start;
        }

        .photo-index-section__title {
          max-width: none;
          font-size: clamp(3.2rem, 16vw, 7rem);
        }

        .photo-index-section__feature-image {
          height: auto;
          aspect-ratio: 4 / 3;
        }

        .photo-index-strip {
          grid-template-columns: repeat(5, minmax(0, 1fr));
        }
      }

      @media (max-width: 560px) {
        .photo-index-section {
          padding-top: calc(5.2rem + var(--safe-top));
        }

        .photo-index-strip {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
    </style>
  </head>
  <body class="page-photo-archive page-photo-index">
    <header class="site-header">
      <a class="site-header__brand" href="../">PORTFOLIO</a>
      <h1 class="site-header__section-title">PHOTOS</h1>
      <nav class="site-nav" aria-label="Primary">
        <a href="../">HOME</a>
        <a href="../my-work/" aria-current="page">MY WORK</a>

          <button class="photo-index-strip__item is-active" type="button" data-large-src="./digital-photos/L1000238.jpeg" data-large-alt="Digital photo selection 01"><span class="photo-index-strip__number">01</span><img class="photo-index-strip__image" src="./digital-photos/L1000238.jpeg" alt="Digital preview 01" loading="lazy"></button>
          <button class="photo-index-strip__item" type="button" data-large-src="./digital-photos/IMG_1252.JPG" data-large-alt="Digital photo selection 02"><span class="photo-index-strip__number">02</span><img class="photo-index-strip__image" src="./digital-photos/IMG_1252.JPG" alt="Digital preview 02" loading="lazy"></button>
          <button class="photo-index-strip__item" type="button" data-large-src="./digital-photos/IMG_1253.JPG" data-large-alt="Digital photo selection 03"><span class="photo-index-strip__number">03</span><img class="photo-index-strip__image" src="./digital-photos/IMG_1253.JPG" alt="Digital preview 03" loading="lazy"></button>
          <button class="photo-index-strip__item" type="button" data-large-src="./digital-photos/IMG_1256.JPG" data-large-alt="Digital photo selection 04"><span class="photo-index-strip__number">04</span><img class="photo-index-strip__image" src="./digital-photos/IMG_1256.JPG" alt="Digital preview 04" loading="lazy"></button>
          <button class="photo-index-strip__item" type="button" data-large-src="./digital-photos/IMG_1259.JPG" data-large-alt="Digital photo selection 05"><span class="photo-index-strip__number">05</span><img class="photo-index-strip__image" src="./digital-photos/IMG_1259.JPG" alt="Digital preview 05" loading="lazy"></button>
          <button class="photo-index-strip__item" type="button" data-large-src="./digital-photos/IMG_1260.JPG" data-large-alt="Digital photo selection 06"><span class="photo-index-strip__number">06</span><img class="photo-index-strip__image" src="./digital-photos/IMG_1260.JPG" alt="Digital preview 06" loading="lazy"></button>
          <button class="photo-index-strip__item" type="button" data-large-src="./digital-photos/IMG_1261.JPG" data-large-alt="Digital photo selection 07"><span class="photo-index-strip__number">07</span><img class="photo-index-strip__image" src="./digital-photos/IMG_1261.JPG" alt="Digital preview 07" loading="lazy"></button>
          <button class="photo-index-strip__item" type="button" data-large-src="./digital-photos/IMG_1264.JPG" data-large-alt="Digital photo selection 08"><span class="photo-index-strip__number">08</span><img class="photo-index-strip__image" src="./digital-photos/IMG_1264.JPG" alt="Digital preview 08" loading="lazy"></button>
          <button class="photo-index-strip__item" type="button" data-large-src="./digital-photos/L1000078.jpeg" data-large-alt="Digital photo selection 09"><span class="photo-index-strip__number">09</span><img class="photo-index-strip__image" src="./digital-photos/L1000078.jpeg" alt="Digital preview 09" loading="lazy"></button>
          <button class="photo-index-strip__item" type="button" data-large-src="./digital-photos/L1000087.jpeg" data-large-alt="Digital photo selection 10"><span class="photo-index-strip__number">10</span><img class="photo-index-strip__image" src="./digital-photos/L1000087.jpeg" alt="Digital preview 10" loading="lazy"></button>
        </div>
      </section>

      <section class="photo-index-section" aria-labelledby="film-title">
        <div class="photo-index-section__topline">
          <span>Scroll / 02</span>
          <span>Film Photos</span>
        </div>

        <div class="photo-index-section__layout">
          <div class="photo-index-section__copy">
            <p class="photo-index-section__count">01/10</p>
            <h2 class="photo-index-section__title" id="film-title">Film Photo</h2>
            <a class="photo-index-section__more" href="./film-photos/">View More</a>
          </div>

          <figure class="photo-index-section__feature">
            <img class="photo-index-section__feature-image" src="./film-photos/IMG_2039.JPG" alt="Film photo selection 01">
            <figcaption class="photo-index-section__caption">
              <span>Film selection</span>
            </figcaption>
          </figure>
        </div>

        <div class="photo-index-strip" aria-label="Film photo preview strip">
          <button class="photo-index-strip__item is-active" type="button" data-large-src="./film-photos/IMG_2039.JPG" data-large-alt="Film photo selection 01"><span class="photo-index-strip__number">01</span><img class="photo-index-strip__image" src="./film-photos/IMG_2039.JPG" alt="Film preview 01" loading="lazy"></button>
          <button class="photo-index-strip__item" type="button" data-large-src="./film-photos/IMG_2043.JPG" data-large-alt="Film photo selection 02"><span class="photo-index-strip__number">02</span><img class="photo-index-strip__image" src="./film-photos/IMG_2043.JPG" alt="Film preview 02" loading="lazy"></button>
          <button class="photo-index-strip__item" type="button" data-large-src="./film-photos/IMG_2046.JPG" data-large-alt="Film photo selection 03"><span class="photo-index-strip__number">03</span><img class="photo-index-strip__image" src="./film-photos/IMG_2046.JPG" alt="Film preview 03" loading="lazy"></button>
          <button class="photo-index-strip__item" type="button" data-large-src="./film-photos/IMG_2048.JPG" data-large-alt="Film photo selection 04"><span class="photo-index-strip__number">04</span><img class="photo-index-strip__image" src="./film-photos/IMG_2048.JPG" alt="Film preview 04" loading="lazy"></button>
          <button class="photo-index-strip__item" type="button" data-large-src="./film-photos/IMG_2054.JPG" data-large-alt="Film photo selection 05"><span class="photo-index-strip__number">05</span><img class="photo-index-strip__image" src="./film-photos/IMG_2054.JPG" alt="Film preview 05" loading="lazy"></button>
          <button class="photo-index-strip__item" type="button" data-large-src="./film-photos/IMG_2057.JPG" data-large-alt="Film photo selection 06"><span class="photo-index-strip__number">06</span><img class="photo-index-strip__image" src="./film-photos/IMG_2057.JPG" alt="Film preview 06" loading="lazy"></button>
          <button class="photo-index-strip__item" type="button" data-large-src="./film-photos/IMG_2061.JPG" data-large-alt="Film photo selection 07"><span class="photo-index-strip__number">07</span><img class="photo-index-strip__image" src="./film-photos/IMG_2061.JPG" alt="Film preview 07" loading="lazy"></button>
          <button class="photo-index-strip__item" type="button" data-large-src="./film-photos/IMG_2074.jpg" data-large-alt="Film photo selection 08"><span class="photo-index-strip__number">08</span><img class="photo-index-strip__image" src="./film-photos/IMG_2074.jpg" alt="Film preview 08" loading="lazy"></button>
          <button class="photo-index-strip__item" type="button" data-large-src="./film-photos/IMG_2076.JPG" data-large-alt="Film photo selection 09"><span class="photo-index-strip__number">09</span><img class="photo-index-strip__image" src="./film-photos/IMG_2076.JPG" alt="Film preview 09" loading="lazy"></button>
          <button class="photo-index-strip__item" type="button" data-large-src="./film-photos/IMG_2112.JPG" data-large-alt="Film photo selection 10"><span class="photo-index-strip__number">10</span><img class="photo-index-strip__image" src="./film-photos/IMG_2112.JPG" alt="Film preview 10" loading="lazy"></button>
        </div>
      </section>
    </main>
    <script>
      document.querySelectorAll(".photo-index-section").forEach((section) => {
        const featureImage = section.querySelector(".photo-index-section__feature-image");
        const count = section.querySelector(".photo-index-section__count");
        const buttons = Array.from(section.querySelectorAll(".photo-index-strip__item"));

        buttons.forEach((button, index) => {
          button.addEventListener("click", () => {
            if (!featureImage) return;

            featureImage.src = button.dataset.largeSrc;
            featureImage.alt = button.dataset.largeAlt || "";
            if (count) count.textContent = `${String(index + 1).padStart(2, "0")}/10`;

            buttons.forEach((item) => item.classList.remove("is-active"));
            button.classList.add("is-active");
          });
        });
      });
    </script>
  </body>
</html>
