<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Interactive Work</title>
    <meta name="description" content="Interactive Work category page.">
    <link rel="stylesheet" href="../styles.css">
    <script src="../script.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="site-header__brand" href="../">PORTFOLIO</a>
      <nav class="site-nav" aria-label="Primary">
        <a href="../">HOME</a>
        <a href="../my-work/" aria-current="page">MY WORK</a>
        <a href="../about/">ABOUT</a>
      </nav>
    </header>

    <main class="page-main page-main--photo-poster">
      <section class="photo-poster photo-poster--interactive" aria-labelledby="interactive-work-title">
        <div class="photo-poster__top">
          <a class="page-back" href="../my-work/">Back to My Work</a>

          <div class="photo-poster__strip" id="projects" aria-label="Interactive work projects">
            <a class="photo-poster__item" href="./p5.js-work/">
              <div class="photo-poster__item-media">
                <video
                  autoplay
                  muted
                  loop
                  playsinline
                  preload="metadata"
                  data-max-seconds="34"
                  data-max-mode="loop"
                  aria-label="p5.js work preview"
                >
                  <source src="./p5.js-work/Screen%20Recording%202026-03-27%20at%2001.01.20.mov" type="video/quicktime">
                </video>
              </div>
              <div class="photo-poster__item-meta">
                <p class="photo-poster__item-index">01</p>
                <p class="photo-poster__item-label">P5.js Work</p>
              </div>
            </a>
          </div>
        </div>

        <div class="photo-poster__hero">
          <h1 class="photo-poster__title photo-poster__title--interactive" id="interactive-work-title">INTERACTIVE WORK</h1>
        </div>
      </section>
    </main>
  </body>
</html>
