<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Interactive Work</title>
    <meta name="description" content="Interactive Work category page.">
    <link rel="stylesheet" href="../styles.css?v=20260601m">
    <script src="../script.js?v=20260529f" defer></script>
  </head>
  <body class="page-interactive-archive">
    <header class="site-header">
      <a class="site-header__brand" href="../">PORTFOLIO</a>
      <h1 class="site-header__section-title" id="interactive-work-title">INTERACTIVE WORK</h1>
      <nav class="site-nav" aria-label="Primary">
        <a href="../">HOME</a>
        <a href="../my-work/" aria-current="page">MY WORK</a>
        <a href="../about/">ABOUT</a>
      </nav>
    </header>

    <main class="page-main page-main--photo-poster">
      <section class="photo-poster photo-poster--interactive" aria-labelledby="interactive-work-title">
        <div class="interactive-live-media" aria-hidden="true">
          <video
            class="interactive-live-media__video"
            data-interactive-live-video
            muted
            loop
            playsinline
            preload="metadata"
          ></video>
        </div>

        <canvas class="interactive-live-bg" data-interactive-live-bg aria-hidden="true"></canvas>
        <canvas class="interactive-live-face-layer" data-interactive-face-layer aria-hidden="true"></canvas>
        <video class="interactive-face-mode__video" data-interactive-face-mode-video playsinline muted aria-hidden="true"></video>

        <div class="interactive-work-gate" data-interactive-work-gate role="button" tabindex="0" aria-label="Open interactive works">
          <button class="interactive-work-gate__audio-toggle" type="button" data-interactive-camera-toggle aria-pressed="false" aria-label="Open camera for face tracking">
            CAMERA
          </button>
          <video class="interactive-work-gate__camera-preview" data-interactive-camera-preview playsinline muted aria-hidden="true"></video>
          <span class="interactive-work-gate__beacon" aria-hidden="true"></span>
        </div>

        <div class="photo-poster__top">
          <div class="interactive-work-toolbar">
            <a class="page-back" href="../my-work/index.html">Back to Work Topics</a>
            <button class="interactive-work-face-toggle" type="button" data-interactive-face-mode-toggle aria-pressed="false" aria-label="Enable face mode">
              FACE MODE
            </button>
          </div>

          <div class="photo-poster__strip" id="projects" aria-label="Interactive work projects">
            <a class="photo-poster__item" href="./p5.js-work/" data-interactive-hue="214" data-interactive-preview="./p5.js-work/Screen%20Recording%202026-03-27%20at%2001.01.20.mov">
              <div class="photo-poster__item-media">
                <video
                  autoplay
                  muted
                  loop
                  playsinline
                  preload="metadata"
                  data-max-seconds="34"
                  data-max-mode="loop"
                  aria-label="p5.js work preview"
                >
                  <source src="./p5.js-work/Screen%20Recording%202026-03-27%20at%2001.01.20.mov" type="video/quicktime">
                </video>
              </div>
              <div class="photo-poster__item-meta">
                <p class="photo-poster__item-index">01</p>
                <p class="photo-poster__item-label">P5.js Work</p>
              </div>
            </a>

            <a class="photo-poster__item" href="./The%20Last%20Light%E2%80%94Interactive%20Flower%20Lamp/" data-interactive-hue="176" data-interactive-preview="./The%20Last%20Light%E2%80%94Interactive%20Flower%20Lamp/game_environment.mp4">
              <div class="photo-poster__item-media">
                <video
                  autoplay
                  muted
                  loop
                  playsinline
                  preload="metadata"
                  aria-label="The Last Light interactive flower lamp preview"
                >
                  <source src="./The%20Last%20Light%E2%80%94Interactive%20Flower%20Lamp/game_environment.mp4" type="video/mp4">
                </video>
              </div>
              <div class="photo-poster__item-meta">
                <p class="photo-poster__item-index">02</p>
                <p class="photo-poster__item-label">The Last Light</p>
              </div>
            </a>

            <a class="photo-poster__item" href="../filialproject.html" data-interactive-hue="252" data-interactive-preview="../filialproject/filial%20web%20test%201.mov">
              <div class="photo-poster__item-media">
                <video
                  autoplay
                  muted
                  loop
                  playsinline
                  preload="metadata"
                  aria-label="Filial Project preview"
                >
                  <source src="../filialproject/filial%20web%20test%201.mov" type="video/quicktime">
                </video>
              </div>
              <div class="photo-poster__item-meta">
                <p class="photo-poster__item-index">03</p>
                <p class="photo-poster__item-label">Filial Project</p>
              </div>
            </a>
          </div>
        </div>

      </section>
    </main>
  </body>
</html>
